# 数据集根路径（建议改为水稻数据集的实际根目录，方便管理）
path: D:/project/rice # 如果水稻数据在其他路径，比如D:/project/rice/dataset，就修改这里

# 训练/验证/测试集路径（保留水稻的文件夹格式，更符合YOLO默认规范）
train: D:\project\rice\images\train # 等价于 D:/project/yumi/dataset/train/images
val: D:\project\rice\images\val # 等价于 D:/project/yumi/dataset/valid/images
test: D:\project\rice\images\test # 等价于 D:/project/yumi/dataset/test/images

# 水稻类别数：3类（删除玉米的8类，只保留水稻的3类）
nc: 3

# 水稻类别名称（完全保留水稻的，删除所有玉米相关的）
names:
  0: Bacteria_Leaf_Blight # 水稻白叶枯病
  1: Brown_Spot # 水稻褐斑病
  2: Leaf_smut # 水稻叶黑粉病

# Roboflow相关配置（保留，因为是水稻数据集的来源信息）
roboflow:
  workspace: dreamydaisy-cdagn
  project: rice-dyl9n
  version: 4
  license: CC BY 4.0
  url: https://universe.roboflow.com/dreamydaisy-cdagn/rice-dyl9n/dataset/4
